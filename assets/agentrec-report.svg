    <text x="48" y="194" fill="#8C99A6">  Source       <tspan fill="#E6EAEE">claude</tspan></text>
    <text x="48" y="220" fill="#8C99A6">  Assurance    <tspan fill="#E6EAEE">provider_reported</tspan></text>
    <text x="48" y="246" fill="#8C99A6">  Result       <tspan fill="#9ECE6A">success</tspan></text>
    <text x="48" y="272" fill="#8C99A6">  Duration     <tspan fill="#E6EAEE">1.221s</tspan></text>

    <text x="48" y="318" fill="#E8641B" font-weight="700">SUPERVISOR-OBSERVED RESULT</text>
    <text x="48" y="346" fill="#8C99A6">  Status       <tspan fill="#FEBC2E">UNAVAILABLE</tspan><tspan fill="#8C99A6"> (interactive session: agentrec was not the parent process)</tspan></text>
    <text x="48" y="372" fill="#8C99A6">  Session      <tspan fill="#E6EAEE">232ebb0e-bc2b-46af-918b-799eda7641d6</tspan></text>
