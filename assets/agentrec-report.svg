    <text x="48" y="450" fill="#8C99A6">  Duration     <tspan fill="#E6EAEE">10.262465s</tspan></text>

    <text x="48" y="496" fill="#E8641B" font-weight="700">REPOSITORY-OBSERVED CHANGES</text>
    <text x="48" y="524" fill="#8C99A6">  Status       <tspan fill="#9ECE6A">AVAILABLE</tspan></text>
    <text x="48" y="550" fill="#8C99A6">  Files        <tspan fill="#E6EAEE">1 (1 tracked, 0 untracked)</tspan></text>
