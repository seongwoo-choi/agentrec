  <circle cx="58" cy="26" r="7" fill="#FEBC2E"/>
  <circle cx="82" cy="26" r="7" fill="#28C840"/>
  <g font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="600" y="32" text-anchor="middle" fill="#8C99A6">agentrec show latest</text>

    <text x="48" y="98" fill="#E6EAEE" font-weight="700">ACTION TIMELINE</text>

