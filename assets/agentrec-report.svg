<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="agentrec show latest: an interactive session recorded from hooks, rendered as an action timeline with four evidence sections">
  <rect x="0" y="0" width="1200" height="760" rx="18" fill="#0F1418" stroke="#2A333C" stroke-width="2"/>
  <rect x="0" y="0" width="1200" height="52" rx="18" fill="#161C22"/>
