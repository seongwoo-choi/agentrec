name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check localized README contracts
        run: |
          python3 scripts/check-readme-localizations.py
          sh scripts/check-readme-localizations_test.sh

      - name: Test
        run: go test ./... -count=1 -timeout=420s

      - name: Test with the race detector
        run: go test -race ./... -count=1 -timeout=600s

      - name: Vet
        run: go vet ./...

      - name: Test release script boundaries
        run: sh scripts/build-release_test.sh

      - name: Build
        run: go build ./...
